[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfcompleto"
version = "1.0.0"
description = "Ferramentas do PDF completo de um relatório Power BI: URL do relatório paginado, divisão em tabelas e validação do PDF"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "Bruno Maia" }]
dependencies = ["pypdf>=4"]

[project.optional-dependencies]
dev = ["pytest>=8", "fpdf2>=2.7", "lxml>=5"]

[project.scripts]
pdfcompleto = "pdfcompleto.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
